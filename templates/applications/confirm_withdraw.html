{% extends 'base.html' %}
{% block title %}Withdraw Application{% endblock %}
{% block content %}
<div style="max-width:480px;margin:2rem auto;">
  <div class="card" style="text-align:center;">
    <div style="font-size:3rem;margin-bottom:1rem;">⚠️</div>
    <h2>Withdraw Application?</h2>
    <p style="color:var(--gray-500);margin:1rem 0;">
      Are you sure you want to withdraw your application for <strong>{{ application.scholarship.title }}</strong>?
      This action cannot be undone.
    </p>
    <form method="post" style="display:flex;gap:0.75rem;justify-content:center;">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, Withdraw</button>
      <a href="{% url 'my_applications' %}" class="btn btn-outline">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
